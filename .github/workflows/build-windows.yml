name: Build Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.14.2
      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive "ffmpeg.zip" -DestinationPath "ffmpeg-package"
          $ffmpeg = Get-ChildItem "ffmpeg-package" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe not found" }
          New-Item -ItemType Directory -Force -Path "vendor" | Out-Null
          Copy-Item $ffmpeg.FullName "vendor\ffmpeg.exe"
      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --noupx --name "Music Video Tool" --collect-all customtkinter --hidden-import PIL._tkinter_finder app.py
          Copy-Item "vendor\ffmpeg.exe" "dist\Music Video Tool\ffmpeg.exe"
          Copy-Item "THIRD_PARTY_NOTICES.txt" "dist\Music Video Tool\THIRD_PARTY_NOTICES.txt"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"
          if (-not (Test-Path "installer\MusicVideoTool_Setup.exe")) { throw "Installer was not created" }
      - uses: actions/upload-artifact@v4
        with:
          name: Music-Video-Tool-Installer
          path: installer/MusicVideoTool_Setup.exe
          if-no-files-found: error
          retention-days: 30
